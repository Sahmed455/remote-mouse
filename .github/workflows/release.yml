name: Build & Package Windows App

on:
  push:
    branches:
      - test
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies & Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Determine Version
        id: version_step
        shell: pwsh
        run: |
          $ver = "1.0.0.0"
          if ($env:GITHUB_REF -match 'refs/tags/v?(.*)') {
              $raw = $Matches[1]
              $parts = $raw.Split(".")
              while ($parts.Count -lt 4) { $parts += "0" }
              $ver = ($parts[0..3] -join ".")
          } else {
              $pyproject = Get-Content pyproject.toml -Raw
              if ($pyproject -match 'version\s*=\s*"([^"]+)"') {
                  $parts = $Matches[1].Split(".")
                  while ($parts.Count -lt 4) { $parts += "0" }
                  $ver = ($parts[0..3] -join ".")
              }
          }
          Write-Host "Resolved Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Compile with Nuitka (Standalone)
        shell: pwsh
        run: |
          $ver = "${{ steps.version_step.outputs.version }}"
          python -m nuitka `
            --mode=standalone `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=remote_mouse `
            --include-package=uvicorn `
            --include-package=websockets `
            --include-package=pynput `
            --include-package=pystray `
            --include-data-dir="src\remote_mouse\web=remote_mouse/web" `
            --output-dir="build\nuitka" `
            --output-filename=RemoteMouse.exe `
            --product-name="Remote Mouse" `
            --file-description="Encrypted Remote Mouse and Keyboard Host" `
            --file-version=$ver `
            --product-version=$ver `
            --windows-uac-uiaccess `
            --assume-yes-for-downloads `
            run.py

      - name: Package Standalone ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Move-Item -Path "build\nuitka\run.dist" -Destination "dist\RemoteMouse"

          # Locate SignTool & sign standalone executable with persistent cert
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $pfx = "packaging\certs\RemoteMouse_Persistent.pfx"
          & $signtool sign /fd SHA256 /f $pfx /p "RemoteMouse2026!KeyWave" "dist\RemoteMouse\RemoteMouse.exe"

          Compress-Archive -Path "dist\RemoteMouse" -DestinationPath "dist\RemoteMouse-Windows.zip"

      - name: Build Sideload MSIX (self-signed, for local dev testing)
        shell: pwsh
        run: |
          $ver = "${{ steps.version_step.outputs.version }}"
          $arch = "x64"
          $msixOut = "dist\RemoteMouse_${ver}_${arch}_Sideload.msix"
          $stagingDir = "build\msix_staging_sideload"

          # 1. Prepare staging
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item -Recurse -Force "dist\RemoteMouse\*" $stagingDir
          Copy-Item "packaging\msix\AppxManifest.xml" "$stagingDir\AppxManifest.xml"
          Copy-Item -Recurse -Force "packaging\msix\assets" "$stagingDir\Assets"

          # Update Version in staged manifest
          [xml]$xml = Get-Content "$stagingDir\AppxManifest.xml"
          $xml.Package.Identity.Version = $ver
          $xml.Save("$stagingDir\AppxManifest.xml")

          # Locate MakeAppx & SignTool
          $sdkBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName

          # Pack MSIX
          & $sdkBin pack /d $stagingDir /p $msixOut /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx (sideload) failed" }

          # Sign with persistent self-signed cert
          $pfx = "packaging\certs\RemoteMouse_Persistent.pfx"
          & $signtool sign /fd SHA256 /f $pfx /p "RemoteMouse2026!KeyWave" $msixOut
          if ($LASTEXITCODE -ne 0) { throw "SignTool (sideload) failed" }

          # Copy public cert alongside sideload MSIX (user installs cert once, then MSIX)
          Copy-Item "packaging\certs\RemoteMouse_Persistent.cer" "dist\RemoteMouse_Sideload.cer"
          Write-Host "Sideload MSIX built: $msixOut" -ForegroundColor Cyan

      - name: Build Store MSIX (unsigned, for Microsoft Partner Center upload)
        shell: pwsh
        run: |
          $ver = "${{ steps.version_step.outputs.version }}"
          $arch = "x64"
          $msixOut = "dist\RemoteMouse_${ver}_${arch}_Store.msix"
          $stagingDir = "build\msix_staging_store"

          # 1. Prepare staging — use a CLEAN (unsigned) copy of the EXE
          #    The Store re-signs everything; uploading a pre-signed exe causes
          #    "unexpected signature" errors during Partner Center validation.
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item -Recurse -Force "dist\RemoteMouse\*" $stagingDir
          Copy-Item "packaging\msix\AppxManifest.xml" "$stagingDir\AppxManifest.xml"
          Copy-Item -Recurse -Force "packaging\msix\assets" "$stagingDir\Assets"

          # Update Version in staged manifest
          [xml]$xml = Get-Content "$stagingDir\AppxManifest.xml"
          $xml.Package.Identity.Version = $ver
          $xml.Save("$stagingDir\AppxManifest.xml")

          # Locate MakeAppx
          $sdkBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName

          # Pack MSIX — NO signing step (Partner Center signs with Microsoft cert)
          & $sdkBin pack /d $stagingDir /p $msixOut /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx (store) failed" }

          Write-Host "Store MSIX built (unsigned, ready for Partner Center): $msixOut" -ForegroundColor Green

      - name: Upload Artifacts (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: RemoteMouse-Packages
          path: |
            dist/RemoteMouse-Windows.zip
            dist/*_Sideload.msix
            dist/*_Store.msix
            dist/RemoteMouse_Sideload.cer

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## DeviLX KeyWave ${{ steps.version_step.outputs.version }}

            ### Installation Options
            | File | Use for |
            |------|---------|
            | `*_Store.msix` | **Microsoft Store submission** (upload to Partner Center) |
            | `*_Sideload.msix` | **Local dev testing** (requires SAC off + one-time cert trust) |
            | `RemoteMouse_Sideload.cer` | Trust certificate for sideload installs |
            | `RemoteMouse-Windows.zip` | Portable ZIP (no install needed) |

            > **For sideload**: Install `RemoteMouse_Sideload.cer` to `LocalMachine\Root` and `LocalMachine\TrustedPeople` first, then install the sideload MSIX.
          files: |
            dist/RemoteMouse-Windows.zip
            dist/*_Sideload.msix
            dist/*_Store.msix
            dist/RemoteMouse_Sideload.cer
