name: Build Windows Standalone App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install package and Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Compile with Nuitka (Standalone)
        shell: pwsh
        run: |
          $ver = "1.0.0.0"
          if ($env:GITHUB_REF -match 'refs/tags/v?(.*)') {
              $raw = $Matches[1]
              $parts = $raw.Split(".")
              while ($parts.Count -lt 4) { $parts += "0" }
              $ver = ($parts[0..3] -join ".")
          }
          Write-Host "Compiling Remote Mouse version: $ver"
          python -m nuitka `
            --mode=standalone `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=remote_mouse `
            --include-package=uvicorn `
            --include-package=websockets `
            --include-package=pynput `
            --include-package=pystray `
            --include-data-dir="src\remote_mouse\web=remote_mouse/web" `
            --output-dir="build\nuitka" `
            --output-filename=RemoteMouse.exe `
            --product-name="Remote Mouse" `
            --file-description="Encrypted Remote Mouse and Keyboard Host" `
            --file-version=$ver `
            --product-version=$ver `
            --assume-yes-for-downloads `
            run.py

      - name: Package ZIP artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Move-Item -Path "build\nuitka\run.dist" -Destination "dist\RemoteMouse"
          Compress-Archive -Path "dist\RemoteMouse" -DestinationPath "dist\RemoteMouse-Windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteMouse-Windows
          path: dist/RemoteMouse-Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemoteMouse-Windows.zip