name: Build Windows Standalone App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies and Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Nuitka ordered-set

      - name: Compile with Nuitka (Standalone)
        shell: pwsh
        run: |
          python -m nuitka `
            --mode=standalone `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=uvicorn `
            --include-package=websockets `
            --include-package=pynput `
            --include-package=pystray `
            --output-dir="build\nuitka" `
            --output-filename=RemoteMouse.exe `
            --product-name="Remote Mouse" `
            --file-description="Encrypted Remote Mouse and Keyboard Host" `
            --file-version=1.0.0.0 `
            --product-version=1.0.0.0 `
            --assume-yes-for-downloads `
            remote_mouse.py

      - name: Package ZIP artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Move-Item -Path "build\nuitka\remote_mouse.dist" -Destination "dist\RemoteMouse"
          Compress-Archive -Path "dist\RemoteMouse" -DestinationPath "dist\RemoteMouse-Windows.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteMouse-Windows
          path: dist/RemoteMouse-Windows.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RemoteMouse-Windows.zip