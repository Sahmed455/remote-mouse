name: Build & Package Windows App

on:
  push:
    branches:
      - test
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies & Nuitka
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Determine Version
        id: version_step
        shell: pwsh
        run: |
          $ver = "1.0.0.0"
          if ($env:GITHUB_REF -match 'refs/tags/v?(.*)') {
              $raw = $Matches[1]
              $parts = $raw.Split(".")
              while ($parts.Count -lt 4) { $parts += "0" }
              $ver = ($parts[0..3] -join ".")
          } else {
              $pyproject = Get-Content pyproject.toml -Raw
              if ($pyproject -match 'version\s*=\s*"([^"]+)"') {
                  $parts = $Matches[1].Split(".")
                  while ($parts.Count -lt 4) { $parts += "0" }
                  $ver = ($parts[0..3] -join ".")
              }
          }
          Write-Host "Resolved Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Compile with Nuitka (Standalone)
        shell: pwsh
        run: |
          $ver = "${{ steps.version_step.outputs.version }}"
          python -m nuitka `
            --mode=standalone `
            --windows-console-mode=disable `
            --enable-plugin=tk-inter `
            --include-package=remote_mouse `
            --include-package=uvicorn `
            --include-package=websockets `
            --include-package=pynput `
            --include-package=pystray `
            --include-data-dir="src\remote_mouse\web=remote_mouse/web" `
            --output-dir="build\nuitka" `
            --output-filename=RemoteMouse.exe `
            --product-name="Remote Mouse" `
            --file-description="Encrypted Remote Mouse and Keyboard Host" `
            --file-version=$ver `
            --product-version=$ver `
            --assume-yes-for-downloads `
            run.py

      - name: Package Standalone ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Move-Item -Path "build\nuitka\run.dist" -Destination "dist\RemoteMouse"
          Compress-Archive -Path "dist\RemoteMouse" -DestinationPath "dist\RemoteMouse-Windows.zip"

      - name: Build & Sign MSIX Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version_step.outputs.version }}"
          $arch = "x64"
          $msixOut = "dist\RemoteMouse_${ver}_${arch}.msix"
          $stagingDir = "build\msix_staging"

          # 1. Prepare staging
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item -Recurse -Force "dist\RemoteMouse\*" $stagingDir
          Copy-Item "packaging\msix\AppxManifest.xml" "$stagingDir\AppxManifest.xml"
          Copy-Item -Recurse -Force "packaging\msix\assets" "$stagingDir\Assets"

          # Update Version in staged manifest
          [xml]$xml = Get-Content "$stagingDir\AppxManifest.xml"
          $xml.Package.Identity.Version = $ver
          $xml.Save("$stagingDir\AppxManifest.xml")

          # Locate MakeAppx & SignTool
          $sdkBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName

          # 2. Pack MSIX
          & $sdkBin pack /d $stagingDir /p $msixOut /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed" }

          # 3. Create a self-signed cert on the runner and sign
          $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=A7EC737B-6680-4F8B-98DE-1ED41C093A45" `
              -KeyUsage DigitalSignature `
              -FriendlyName "RemoteMouse CI Certificate" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          & $signtool sign /fd SHA256 /a /n "A7EC737B-6680-4F8B-98DE-1ED41C093A45" $msixOut
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed" }

          # Export cert for download alongside MSIX
          Export-Certificate -Cert $cert -FilePath "dist\RemoteMouse_Sideload.cer"
          Write-Host "MSIX packaged and signed: $msixOut" -ForegroundColor Green

      - name: Upload Artifacts (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: RemoteMouse-Packages
          path: |
            dist/RemoteMouse-Windows.zip
            dist/*.msix
            dist/*.cer

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RemoteMouse-Windows.zip
            dist/*.msix
            dist/*.cer
