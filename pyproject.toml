[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-mouse"
version = "1.1.0"
description = "Encrypted local-network and USB remote mouse and keyboard host"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "websockets",
  "pynput",
  "cryptography",
  "qrcode",
  "pystray",
  "pillow",
]

[project.optional-dependencies]
build = ["Nuitka", "ordered-set"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remote_mouse = ["web/*.html"]